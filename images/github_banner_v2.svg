    <text x="105" y="272" fill="#f4f8ff" font-size="86" font-weight="760" letter-spacing="-2.2">Md. Atikur Rahaman</text>
    <rect x="110" y="305" width="104" height="7" rx="3.5" fill="url(#accent)"/>
    <text x="108" y="390" fill="#c0d7ea" font-size="43" font-weight="650">Full Stack Engineer <tspan fill="#52d9d0">·</tspan> AI/ML Engineer</text>
    <text x="110" y="448" fill="#c6d5e6" font-size="30" font-weight="450">I build reliable web products and practical AI systems.</text>
    <g transform="translate(108 520)">
      <rect width="180" height="54" rx="15" fill="#15273c" stroke="#6ec9dc" stroke-opacity=".48"/><text x="90" y="35" text-anchor="middle" fill="#e0f5ff" font-size="23" font-weight="650">Next.js</text>
      <rect x="198" width="207" height="54" rx="15" fill="#15273c" stroke="#6ec9dc" stroke-opacity=".48"/><text x="301.5" y="35" text-anchor="middle" fill="#e0f5ff" font-size="23" font-weight="650">TypeScript</text>
      <rect x="423" width="220" height="54" rx="15" fill="#15273c" stroke="#6ec9dc" stroke-opacity=".48"/><text x="533" y="35" text-anchor="middle" fill="#e0f5ff" font-size="22" font-weight="650">Agentic AI · RAG</text>
      <rect x="661" width="260" height="54" rx="15" fill="#15273c" stroke="#6ec9dc" stroke-opacity=".48"/><text x="791" y="35" text-anchor="middle" fill="#e0f5ff" font-size="20" font-weight="650">PostgreSQL · pgvector</text>
    </g>
    <text x="111" y="683" fill="#9ab0c9" font-size="23" font-weight="550">atikurrahaman.site</text>
    <circle cx="325" cy="676" r="3" fill="#57d5d1"/>
    <text x="348" y="683" fill="#9ab0c9" font-size="23" font-weight="550">3+ years building for the web</text>
  </g>
  <g font-family="Segoe UI, Inter, Arial, sans-serif" filter="url(#shadow)">
    <text x="1246" y="143" fill="#8fa8c0" font-size="18" font-weight="700" letter-spacing="2.6">WHAT I BUILD</text>
