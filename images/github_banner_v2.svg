    <rect x="1407" y="177" width="173" height="382" rx="24" fill="#102138" fill-opacity=".88" stroke="#7ea7c9" stroke-opacity=".24"/>
    <rect x="1599" y="177" width="173" height="382" rx="24" fill="#102138" fill-opacity=".88" stroke="#7ea7c9" stroke-opacity=".24"/>
