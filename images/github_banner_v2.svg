<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="780" viewBox="0 0 1800 780" role="img" aria-labelledby="title desc">
  <title id="title">Md. Atikur Rahaman | Full Stack Engineer and AI/ML Engineer</title>
  <desc id="desc">A clear portfolio banner presenting Atikur Rahaman's full stack and AI/ML engineering work, with large icons for web products, agentic AI, and data platforms.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset=".55" stop-color="#101c32"/><stop offset="1" stop-color="#081625"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#51e0ca"/><stop offset="1" stop-color="#72aaff"/></linearGradient>
    <radialGradient id="halo"><stop stop-color="#1486a1" stop-opacity=".29"/><stop offset="1" stop-color="#1486a1" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#91a9c4" stroke-opacity=".055" stroke-width="1"/></pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000814" flood-opacity=".25"/></filter>
  </defs>
  <rect width="1800" height="780" rx="30" fill="url(#bg)"/><rect width="1800" height="780" rx="30" fill="url(#grid)"/>
  <circle cx="1470" cy="390" r="520" fill="url(#halo)"/>
  <path d="M0 754C360 664 560 810 900 728S1450 666 1800 752" fill="none" stroke="#4b9dff" stroke-opacity=".12" stroke-width="3"/>
