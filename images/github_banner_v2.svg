<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640" role="img" aria-labelledby="title desc">
  <title id="title">Md. Atikur Rahaman — Full Stack Engineer and AI/ML Specialist</title>
  <desc id="desc">A dark navy technology banner with a subtle grid, connected AI nodes, and clear labels for Next.js, TypeScript, Agentic AI, LangGraph, RAG, PostgreSQL, and pgvector.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#101b31"/>
      <stop offset="1" stop-color="#091323"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4de3d0"/>
      <stop offset="1" stop-color="#62aaff"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#1c91b6" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#1c91b6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#8aa5c4" stroke-opacity="0.075" stroke-width="1"/>
    </pattern>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="9"/>
      <feOffset dy="4"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="rounded"><rect width="1600" height="640" rx="30"/></clipPath>
  </defs>

  <g clip-path="url(#rounded)">
    <rect width="1600" height="640" fill="url(#background)"/>
    <rect width="1600" height="640" fill="url(#grid)"/>
    <circle cx="1280" cy="320" r="410" fill="url(#glow)"/>
    <path d="M0 560C260 460 420 650 690 540S1130 430 1600 555" fill="none" stroke="#3b82f6" stroke-opacity="0.08" stroke-width="2"/>

    <g font-family="Segoe UI, Inter, Arial, sans-serif">
      <rect x="104" y="108" width="360" height="42" rx="21" fill="#0d2b2d" stroke="#2dd4bf" stroke-opacity="0.45"/>
      <circle cx="129" cy="129" r="5" fill="#34d399"/>
      <text x="147" y="135" fill="#9deadd" font-size="16" font-weight="650" letter-spacing="1.2">AVAILABLE FOR FULL-TIME / REMOTE</text>

      <text x="100" y="248" fill="#f1f7ff" font-size="59" font-weight="760" letter-spacing="-1.8">Md. Atikur Rahaman</text>
      <rect x="102" y="278" width="72" height="5" rx="2.5" fill="url(#accent)"/>
      <text x="100" y="335" fill="#a9c9e0" font-size="31" font-weight="600">Full Stack Engineer <tspan fill="#52d9d0">·</tspan> AI/ML Specialist</text>
      <text x="102" y="386" fill="#9baec4" font-size="20" font-weight="450">Production-ready applications and intelligent systems</text>

      <g transform="translate(100 454)">
        <rect width="115" height="42" rx="12" fill="#17253a" stroke="#7dd3fc" stroke-opacity="0.38"/>
        <text x="57.5" y="27" text-anchor="middle" fill="#d6f3ff" font-size="17" font-weight="650">Next.js 16</text>
        <rect x="129" width="132" height="42" rx="12" fill="#17253a" stroke="#7dd3fc" stroke-opacity="0.38"/>
        <text x="195" y="27" text-anchor="middle" fill="#d6f3ff" font-size="17" font-weight="650">TypeScript</text>
        <rect x="275" width="157" height="42" rx="12" fill="#17253a" stroke="#7dd3fc" stroke-opacity="0.38"/>
        <text x="353.5" y="27" text-anchor="middle" fill="#d6f3ff" font-size="17" font-weight="650">Agentic AI · RAG</text>
        <rect x="446" width="201" height="42" rx="12" fill="#17253a" stroke="#7dd3fc" stroke-opacity="0.38"/>
        <text x="546.5" y="27" text-anchor="middle" fill="#d6f3ff" font-size="17" font-weight="650">PostgreSQL · pgvector</text>
      </g>
      <text x="102" y="552" fill="#647b96" font-size="17" font-weight="500">atikurrahaman.site</text>
      <text x="286" y="552" fill="#41556d" font-size="17">/</text>
      <text x="304" y="552" fill="#647b96" font-size="17" font-weight="500">3+ years building for the web</text>
    </g>

    <!-- Connected systems motif -->
    <g stroke="url(#accent)" stroke-opacity="0.5" stroke-width="2" fill="none">
      <path d="M1025 209L1196 149L1371 218L1254 329L1055 370L1150 493L1374 448L1450 318L1371 218"/>
      <path d="M1196 149L1254 329L1450 318M1055 370L1254 329L1374 448" stroke-opacity="0.27"/>
    </g>
    <g fill="#0e2033" stroke="#62d9e5" stroke-width="2.5" filter="url(#softShadow)">
      <circle cx="1025" cy="209" r="16"/><circle cx="1196" cy="149" r="22"/>
      <circle cx="1371" cy="218" r="17"/><circle cx="1254" cy="329" r="27"/>
      <circle cx="1055" cy="370" r="18"/><circle cx="1374" cy="448" r="21"/>
      <circle cx="1450" cy="318" r="14"/><circle cx="1150" cy="493" r="15"/>
    </g>
    <g font-family="Segoe UI, Inter, Arial, sans-serif" font-weight="700" text-anchor="middle">
      <text x="1196" y="155" fill="#baf8f1" font-size="14">TS</text>
      <text x="1254" y="335" fill="#baf8f1" font-size="16">AI</text>
      <text x="1374" y="454" fill="#baf8f1" font-size="13">DB</text>
    </g>
    <g font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#a6bdd3">
      <text x="1086" y="187">Next.js</text>
      <text x="1285" y="177">LangGraph</text>
      <text x="1291" y="300">RAG</text>
      <text x="1400" y="425">pgvector</text>
    </g>
    <rect x="1" y="1" width="1598" height="638" rx="29" fill="none" stroke="#8ba4bd" stroke-opacity="0.2"/>
  </g>
</svg>
