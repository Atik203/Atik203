    <path d="M-21 -19L-36 -30M21 -19L36 -30M-21 20L-36 31M21 20L36 31"/>
    <path d="M0 -15l4 10 10 4-10 4-4 10-4-10-10-4 10-4z" fill="#a6f4e4" stroke="none"/>
