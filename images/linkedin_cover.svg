<svg xmlns="http://www.w3.org/2000/svg" width="1584" height="396" viewBox="0 0 1584 396" role="img" aria-labelledby="title desc">
  <title id="title">Md. Atikur Rahaman — Full Stack Engineer and AI/ML Engineer</title>
  <desc id="desc">LinkedIn cover banner with a dark navy technical background, profile-photo safe space on the left, and connected AI system illustration on the right.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset=".58" stop-color="#101b31"/><stop offset="1" stop-color="#081827"/></linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#4de3d0"/><stop offset="1" stop-color="#62aaff"/></linearGradient>
    <radialGradient id="halo"><stop stop-color="#177c9b" stop-opacity=".38"/><stop offset="1" stop-color="#177c9b" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#8aa5c4" stroke-opacity=".065"/></pattern>
  </defs>
  <rect width="1584" height="396" fill="url(#bg)"/><rect width="1584" height="396" fill="url(#grid)"/>
  <circle cx="1290" cy="190" r="300" fill="url(#halo)"/>
  <path d="M0 346C300 258 420 417 710 320S1180 250 1584 355" fill="none" stroke="#3b82f6" stroke-opacity=".11" stroke-width="2"/>
