  </g>
  <text x="1395" y="178" text-anchor="middle" fill="#eaf5ff" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="700">AGENTIC AI</text>
  <text x="1395" y="197" text-anchor="middle" fill="#b5c9dc" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12" font-weight="600">LLM SYSTEMS</text>
