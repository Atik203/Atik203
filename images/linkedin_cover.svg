  <text x="1535" y="178" text-anchor="middle" fill="#eaf5ff" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="700">DATA</text>
  <text x="1535" y="197" text-anchor="middle" fill="#b5c9dc" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12" font-weight="600">PLATFORMS</text>
  <rect x="1" y="1" width="1582" height="394" fill="none" stroke="#94abc5" stroke-opacity=".19" stroke-width="2"/>
