<svg xmlns="http://www.w3.org/2000/svg" width="1584" height="396" viewBox="0 0 1584 396" role="img" aria-labelledby="title desc">
  <title id="title">Md. Atikur Rahaman | Full Stack Engineer and AI/ML Engineer</title>
  <desc id="desc">LinkedIn cover presenting Atikur Rahaman's full stack and AI/ML engineering work. The left side is clear for the profile photo; large web, AI, and data icons sit on the right.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset=".55" stop-color="#101c32"/><stop offset="1" stop-color="#081625"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#51e0ca"/><stop offset="1" stop-color="#72aaff"/></linearGradient>
    <radialGradient id="halo"><stop stop-color="#1486a1" stop-opacity=".32"/><stop offset="1" stop-color="#1486a1" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#91a9c4" stroke-opacity=".055"/></pattern>
  </defs>
  <rect width="1584" height="396" fill="url(#bg)"/><rect width="1584" height="396" fill="url(#grid)"/>
  <circle cx="1330" cy="190" r="340" fill="url(#halo)"/>
  <path d="M0 385C300 355 420 400 720 379S1190 355 1584 385" fill="none" stroke="#4b9dff" stroke-opacity=".12" stroke-width="2"/>
  <!-- Profile-photo safe area: keep all key text and symbols to the right. -->
  <g font-family="Segoe UI, Inter, Arial, sans-serif">
    <rect x="426" y="40" width="405" height="34" rx="17" fill="#0c292c" stroke="#35cdbb" stroke-opacity=".5"/>
    <circle cx="448" cy="57" r="4.5" fill="#4be0a2"/>
    <text x="465" y="62" fill="#a8f1df" font-size="13" font-weight="700" letter-spacing="1.2">AVAILABLE FOR FULL-TIME &amp; REMOTE ROLES</text>
    <text x="420" y="145" fill="#f4f8ff" font-size="56" font-weight="760" letter-spacing="-1.4">Md. Atikur Rahaman</text>
    <rect x="426" y="164" width="76" height="5" rx="2.5" fill="url(#accent)"/>
    <text x="424" y="211" fill="#c0d7ea" font-size="30" font-weight="650">Full Stack Engineer <tspan fill="#52d9d0">·</tspan> AI/ML Engineer</text>
    <text x="426" y="247" fill="#c6d5e6" font-size="20" font-weight="450">I build reliable web products and practical AI systems.</text>
    <g transform="translate(424 276)">
      <rect width="110" height="38" rx="11" fill="#15273c" stroke="#6ec9dc" stroke-opacity=".48"/><text x="55" y="25" text-anchor="middle" fill="#e0f5ff" font-size="16" font-weight="650">Next.js</text>
      <rect x="121" width="138" height="38" rx="11" fill="#15273c" stroke="#6ec9dc" stroke-opacity=".48"/><text x="190" y="25" text-anchor="middle" fill="#e0f5ff" font-size="16" font-weight="650">TypeScript</text>
      <rect x="270" width="157" height="38" rx="11" fill="#15273c" stroke="#6ec9dc" stroke-opacity=".48"/><text x="348.5" y="25" text-anchor="middle" fill="#e0f5ff" font-size="15" font-weight="650">Agentic AI · RAG</text>
      <rect x="438" width="195" height="38" rx="11" fill="#15273c" stroke="#6ec9dc" stroke-opacity=".48"/><text x="535.5" y="25" text-anchor="middle" fill="#e0f5ff" font-size="14" font-weight="650">PostgreSQL · pgvector</text>
    </g>
    <text x="426" y="356" fill="#a9bdd2" font-size="15" font-weight="600">atikurrahaman.site</text>
    <circle cx="558" cy="351" r="2.5" fill="#57d5d1"/>
    <text x="576" y="356" fill="#a9bdd2" font-size="15" font-weight="600">3+ years building for the web</text>
  </g>
  <!-- Large, simple visual marks with readable text labels. -->
  <g transform="translate(1254 127)" fill="none" stroke="#68e2d1" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
