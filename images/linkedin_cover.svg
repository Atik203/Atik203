    <circle cx="1120" cy="100" r="12"/><circle cx="1274" cy="68" r="17"/><circle cx="1412" cy="135" r="13"/><circle cx="1320" cy="230" r="22"/><circle cx="1132" cy="266" r="14"/><circle cx="1402" cy="302" r="16"/><circle cx="1490" cy="205" r="11"/><circle cx="1200" cy="326" r="12"/>
