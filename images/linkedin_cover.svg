    <text x="520" y="344" fill="#647b96" font-size="13" font-weight="500">atikurrahaman.site</text>
    <text x="653" y="344" fill="#41556d" font-size="13">·</text>
    <text x="670" y="344" fill="#647b96" font-size="13" font-weight="500">3+ years building for the web</text>
  </g>
