    <rect x="520" y="45" width="294" height="32" rx="16" fill="#0d2b2d" stroke="#2dd4bf" stroke-opacity=".5"/>
    <circle cx="540" cy="61" r="4" fill="#34d399"/>
    <text x="555" y="66" fill="#9deadd" font-size="12" font-weight="650" letter-spacing="1">AVAILABLE FOR FULL-TIME / REMOTE</text>
    <text x="516" y="141" fill="#f1f7ff" font-size="43" font-weight="760" letter-spacing="-1.2">Md. Atikur Rahaman</text>
    <rect x="520" y="158" width="66" height="4" rx="2" fill="url(#line)"/>
    <text x="518" y="204" fill="#b5cce0" font-size="23" font-weight="600">Full Stack Engineer <tspan fill="#52d9d0">·</tspan> AI/ML Engineer</text>
    <text x="520" y="236" fill="#91a8c0" font-size="15">Production-ready applications and intelligent systems</text>
    <g transform="translate(518 268)">
      <rect width="91" height="34" rx="10" fill="#17253a" stroke="#7dd3fc" stroke-opacity=".4"/><text x="45.5" y="22" text-anchor="middle" fill="#d6f3ff" font-size="14" font-weight="650">Next.js</text>
      <rect x="101" width="108" height="34" rx="10" fill="#17253a" stroke="#7dd3fc" stroke-opacity=".4"/><text x="155" y="22" text-anchor="middle" fill="#d6f3ff" font-size="14" font-weight="650">TypeScript</text>
      <rect x="219" width="137" height="34" rx="10" fill="#17253a" stroke="#7dd3fc" stroke-opacity=".4"/><text x="287.5" y="22" text-anchor="middle" fill="#d6f3ff" font-size="14" font-weight="650">Agentic AI · RAG</text>
      <rect x="366" width="170" height="34" rx="10" fill="#17253a" stroke="#7dd3fc" stroke-opacity=".4"/><text x="451" y="22" text-anchor="middle" fill="#d6f3ff" font-size="13" font-weight="650">PostgreSQL · pgvector</text>
